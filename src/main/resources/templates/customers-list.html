{@java.util.List<ch.tranchida.sample.quarkus.customer.Customer> customers}
<div class="table-container">
    <table class="table">
        <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
                <th class="th">ID</th>
                <th class="th">Name</th>
                <th class="th text-right">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            {#for customer in customers}
            <tr class="hover:bg-blue-50/30 transition-colors group">
                <td class="td font-mono">{customer.id}</td>
                <td class="td font-semibold text-gray-900">{customer.name}</td>
                <td class="td text-right">
                    <button class="px-4 py-1.5 text-xs font-bold text-red-600 border border-red-200 rounded-lg hover:bg-red-50 transition-colors" 
                            hx-delete="/customers/{customer.id}" 
                            hx-target="#customer-list"
                            hx-confirm="Are you sure you want to delete this customer?">
                        Delete
                    </button>
                </td>
            </tr>
            {/for}
        </tbody>
    </table>
</div>
